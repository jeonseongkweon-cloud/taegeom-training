<section class="course-head"><small id="kind">TRAINING PATH</small><h1 id="title">교육과정</h1><p id="desc"></p><div class="progress"><i></i></div><p><b>프레임워크 구축 완료</b> · 첫 모듈부터 공식 사진·영상·교재·평가 콘텐츠를 순차 탑재합니다.</p></section>

<div class="notice"><b>OPEN TO LEARN · CERTIFIED TO TEACH</b><br>첫 단계는 콘텐츠를 넣기 위한 열린 방입니다. 이후 단계는 선행학습 완료, 회원등록 또는 공식 지도자 인증 조건에 따라 순차 개방될 수 있도록 설계했습니다. 현재 잠금표시는 향후 운영구조를 미리 보여주는 것입니다.</div>

<script>

tkd:["태권도 지도자 Fast Track","태권도 4단 이상 지도자가 기존의 신체운용과 지도경험을 활용해 태권검도 핵심체계를 빠르게 습득하는 전문트랙입니다.","태권검도 체계 이해|검 안전·그립|3대 정면베기 비교|15°·65° 검선|찌르기·막기|보법 전환|태권도 동작과 연결원리|도장 수업 적용법|Fast Track 실기평가|공식 지도자 과정 진입"],
instructor:["WTKF 공식 지도자 과정","정확한 기술뿐 아니라 타인을 안전하고 표준적으로 가르치기 위한 교수법·평가·실습 및 공식 인증 준비과정입니다.","지도자 철학·윤리|공식 명칭·상징 정책|표준기술론|초보자 교수법|아동 지도법|성인 지도법|오류진단·교정|안전관리|수업설계|심사·평가기준|지도실습|이론시험|실기시험|공식 인증"],
academy:["온라인 세미나 · 연수원","국내외 지도자와 수련생이 창시자를 직접 찾아오지 못하더라도 공식 기준으로 교육받을 수 있는 원격연수 과정입니다.","창시자 오리엔테이션|기본기 세미나|초승달·반달·보름달 집중연수|검선 집중연수|찌르기·막기 연수|이동·연결 세미나|지도법 워크숍|과제 제출|온라인 평가|지역 오프라인 교정 연계"],
renewal:["지도자 보수교육","공식 지도자의 기술표준을 유지하고 새로운 교육콘텐츠와 운영기준을 지속적으로 업데이트하는 계속교육입니다.","연간 기술점검|신규 커리큘럼|오류교정 사례|안전 업데이트|지도사례 연구|지역 세미나|오프라인 기술교정|활동기록|보수교육 평가|인증 갱신"]
};
const key=new URLSearchParams(location.search).get("track")||"starter", d=courses[key]||courses.starter;
document.getElementById("title").textContent=d[0];document.getElementById("desc").textContent=d[1];
document.getElementById("kind").textContent=key==="instructor"?"CERTIFICATION PATH":"TRAINING PATH";
document.getElementById("modules").innerHTML=d[2].split("|").map((x,i)=>`<article class="module ${i===0?"open":"lock"}"><small>MODULE ${String(i+1).padStart(2,"0")}</small><h3>${x}</h3><p>${i===0?"공식 콘텐츠를 가장 먼저 채울 시작 모듈입니다. 사진·영상·설명·평가자료를 연결할 준비가 되어 있습니다.":"콘텐츠 슬롯 준비 완료. 앞 단계 완료 후 개방되는 구조로 설계했습니다."}</p><span class="tag">${i===0?"OPEN · CONTENT SLOT":"READY · LOCKED"}</span></article>`).join("");
